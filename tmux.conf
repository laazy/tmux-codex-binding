# Load this file from your regular tmux configuration.
run-shell -b 'exec ~/.local/bin/tmux-codex-title watch "#{socket_path}"'

# Start Codex in the current pane's directory.
bind c new-window -n codex -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-title window'
bind \\ split-window -h -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-title pane'
bind - split-window -v -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-title pane'
