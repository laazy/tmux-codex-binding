# Load this file from your regular tmux configuration.
run-shell -b 'exec ~/.local/bin/tmux-codex-binding watch "#{socket_path}"'

# Start Codex in the current pane's directory.
bind c new-window -n codex -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding window'
bind \\ split-window -h -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind - split-window -v -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding pane'

# Chinese punctuation aliases for the split bindings.
bind-key -T prefix '、' split-window -h -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind-key -T prefix '＼' split-window -h -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind-key -T prefix '－' split-window -v -c "#{pane_current_path}" 'exec ~/.local/bin/tmux-codex-binding pane'
