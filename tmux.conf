# Load this file from your regular tmux configuration.
run-shell -b 'exec ~/.local/bin/tmux-codex-binding watch "#{socket_path}"'

# Start Codex in its configured directory and open ordinary shells in splits.
bind c new-window -n codex -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding window'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Chinese punctuation aliases for the split bindings.
bind-key -T prefix '、' split-window -h -c "#{pane_current_path}"
bind-key -T prefix '＼' split-window -h -c "#{pane_current_path}"
bind-key -T prefix '－' split-window -v -c "#{pane_current_path}"

# Codex alerts and the compact status line.
bind-key -N 'Jump to a Codex window waiting for input' a run-shell -b 'exec ~/.local/bin/tmux-codex-binding jump #{q:socket_path} #{q:client_name} #{q:session_id}'
set -gw window-status-format "#I:#W#{?#{==:#{@codex_turn_notice},done}, ✓,#{?#{==:#{@codex_turn_notice},action}, ?,}}#{?window_flags,#{window_flags}, }"
set -gw window-status-current-format "#I:#W#{?#{==:#{@codex_turn_notice},done}, ✓,#{?#{==:#{@codex_turn_notice},action}, ?,}}#{?window_flags,#{window_flags}, }"
run-shell 'exec ~/.local/bin/tmux-codex-binding compact-status "#{socket_path}"'
