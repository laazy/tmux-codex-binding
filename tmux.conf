# Load this file from your regular tmux configuration.
run-shell -b 'exec ~/.local/bin/tmux-codex-binding watch "#{socket_path}"'

# Use the configured shared directory or inherit the current pane directory.
bind c new-window -n codex -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding window'
bind \\ split-window -h -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind - split-window -v -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding pane'

# Chinese punctuation aliases for the split bindings.
bind-key -T prefix '、' split-window -h -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind-key -T prefix '＼' split-window -h -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding pane'
bind-key -T prefix '－' split-window -v -c "#{?@codex_start_directory,#{@codex_start_directory},#{pane_current_path}}" 'exec ~/.local/bin/tmux-codex-binding pane'
